<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BA8A"/>
      <stop offset="100%" stop-color="#B79A68"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#B79A68" stroke-width="1" stroke-opacity="0.35"/>
  
  <!-- Outer Aperture Ring -->
  <circle cx="25" cy="35" r="16" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.85"/>
  <circle cx="25" cy="35" r="12" stroke="#B79A68" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.6"/>
  <circle cx="25" cy="35" r="3.5" fill="#080808" stroke="#D4BA8A" stroke-width="0.75"/>

  <!-- M Serif Letterform -->
  <path d="M33 50 V24 L43 40 L53 24 V50" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sacred Tilak / Flame Motif -->
  <path d="M43 18 C41.5 14 43 10 43 7 C43 10 44.5 14 43 18 Z" fill="#E05338"/>
  <circle cx="43" cy="20.5" r="1.2" fill="#E05338"/>
</svg>
